server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        set $exchange_backend backend:8080;
        proxy_pass http://$exchange_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /demo-api/ {
        set $demo_backend demo-backend:8080;
        rewrite ^/demo-api/(.*)$ /api/$1 break;
        proxy_pass http://$demo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}
