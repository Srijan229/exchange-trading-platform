services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    volumes: ["data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/exchange
    depends_on:
      db:
        condition: service_healthy
    ports: ["18080:8080"]
volumes:
  data:
